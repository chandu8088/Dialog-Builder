<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="20" fill="url(#bg)"/>
  <!-- XML brackets -->
  <text x="16" y="58" font-family="monospace" font-size="36" font-weight="bold" fill="#ffffff" opacity="0.9">&lt;/&gt;</text>
  <!-- Dialog icon (window) -->
  <rect x="38" y="68" width="52" height="38" rx="4" fill="none" stroke="#ffffff" stroke-width="3"/>
  <rect x="38" y="68" width="52" height="10" rx="4" fill="#ffffff" opacity="0.3"/>
  <!-- Tab indicators -->
  <rect x="44" y="71" width="12" height="4" rx="1" fill="#ffffff" opacity="0.8"/>
  <rect x="59" y="71" width="12" height="4" rx="1" fill="#ffffff" opacity="0.4"/>
  <!-- Field lines -->
  <rect x="44" y="84" width="40" height="3" rx="1" fill="#ffffff" opacity="0.5"/>
  <rect x="44" y="91" width="30" height="3" rx="1" fill="#ffffff" opacity="0.5"/>
  <rect x="44" y="98" width="35" height="3" rx="1" fill="#ffffff" opacity="0.5"/>
  <!-- AEM text -->
  <text x="64" y="122" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" opacity="0.7">AEM</text>
</svg>
